openapi: 3.1.0
info:
  title: KesselOps — Social & Marketing API (Service E)
  description: |
    AI-powered social media post generation, media management, and review
    response automation. Covers Instagram, Facebook, TikTok, and Google Business.

    **Package:** `com.kesselops.social`

    **Cross-domain calls made by this service:**
    - → AI: `AIOrchestrationService.generate(SOCIAL_POST, vars)` (post generation)
    - → AI: `AIOrchestrationService.generate(REVIEW_RESPONSE, vars)` (review responses)
    - → AI: `AIOrchestrationService.suggestHashtags(content)` (hashtag suggestions)
    - → AI: `AIOrchestrationService.generate(SOCIAL_POST, imageUrl)` (GPT-4o Vision caption)
    - → Operations: `ShiftService.getShiftData(shiftId)` (shift context for posts)

    **External integrations:**
    - Meta Graph API (Instagram, Facebook publishing)
    - Google My Business API (review response publishing)
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.kesselops.railway.app
    description: Production

tags:
  - name: Social Posts
    description: AI-powered social media post generation, scheduling, and publishing
  - name: Media
    description: Upload and manage images/videos for social posts (Cloudflare R2)
  - name: Review Responses
    description: "AI-draft responses to Google/platform reviews — Ludwig Heer's feedback loop"

security:
  - BearerAuth: []

paths:

  # ═══════════════════════════════════════
  # E1: SOCIAL POSTS
  # ═══════════════════════════════════════

  /api/posts:
    post:
      operationId: createPost
      tags: [Social Posts]
      summary: Create a social post manually (without AI)
      description: '**Roles:** `OWNER`, `MANAGER`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created as DRAFT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SocialPost'

    get:
      operationId: listPosts
      tags: [Social Posts]
      summary: List social posts (paginated, filterable)
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '../shared/common-schemas.yaml#/components/parameters/VenueIdParam'
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/Platform' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PostStatus' }
        - $ref: '../shared/common-schemas.yaml#/components/parameters/PageParam'
        - $ref: '../shared/common-schemas.yaml#/components/parameters/SizeParam'
        - $ref: '../shared/common-schemas.yaml#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated post list
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/PaginatedResponse'

  /api/posts/generate:
    post:
      operationId: generatePost
      tags: [Social Posts]
      summary: AI-generate a social media post from shift data, photos, or custom prompt
      description: |
        **Roles:** `OWNER`, `MANAGER`
        **Cross-domain:**
        - → AI (`AIOrchestrationService.generate(SOCIAL_POST, vars)`)
        - → Operations (`ShiftService.getShiftData(shiftId)`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePostRequest'
      responses:
        '201':
          description: AI-generated post (DRAFT status, ready for review)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SocialPost'

  /api/posts/{id}:
    get:
      operationId: getPost
      tags: [Social Posts]
      summary: Get a single post with media attachments
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Post with media
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SocialPostDetail'

    put:
      operationId: updatePost
      tags: [Social Posts]
      summary: Edit post content (before publishing)
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SocialPost'

    delete:
      operationId: deletePost
      tags: [Social Posts]
      summary: Delete a draft or scheduled post (cannot delete published)
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '204':
          description: Deleted
        '422':
          description: Cannot delete published posts
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/ErrorResponse'

  /api/posts/{id}/schedule:
    patch:
      operationId: schedulePost
      tags: [Social Posts]
      summary: "Schedule a post for future publishing (DRAFT → SCHEDULED)"
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'

  /api/posts/{id}/publish:
    patch:
      operationId: publishPost
      tags: [Social Posts]
      summary: "Immediately publish to target platform (→ PUBLISHED)"
      description: |
        **Roles:** `OWNER`, `MANAGER`
        **External call:** Meta Graph API (Instagram/Facebook) or platform-specific API.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'

  /api/posts/{id}/suggest-hashtags:
    post:
      operationId: suggestHashtags
      tags: [Social Posts]
      summary: AI-suggest hashtags for a post
      description: |
        **Roles:** `OWNER`, `MANAGER`
        **Cross-domain:** → AI (`AIOrchestrationService.suggestHashtags(content)`)
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: Suggested hashtags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hashtags:
                            type: array
                            items: { type: string }
                            example: ["#stuttgart", "#cocktails", "#nightlife", "#barlife", "#oscho"]

  # ═══════════════════════════════════════
  # E2: MEDIA
  # ═══════════════════════════════════════

  /api/media:
    post:
      operationId: uploadMedia
      tags: [Media]
      summary: Upload a media file (image or video)
      description: |
        **Roles:** `OWNER`, `MANAGER`, `STAFF`
        Max 10MB for images (JPEG, PNG, WebP), 50MB for video (MP4).
        Files stored in Cloudflare R2.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: '#/components/schemas/MediaType'
                altText:
                  type: string
      responses:
        '201':
          description: Media uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Media'

    get:
      operationId: listMedia
      tags: [Media]
      summary: List all media files (paginated)
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '../shared/common-schemas.yaml#/components/parameters/VenueIdParam'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/MediaType' }
        - $ref: '../shared/common-schemas.yaml#/components/parameters/PageParam'
        - $ref: '../shared/common-schemas.yaml#/components/parameters/SizeParam'
        - $ref: '../shared/common-schemas.yaml#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated media list
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/PaginatedResponse'

  /api/media/{id}:
    get:
      operationId: getMedia
      tags: [Media]
      summary: Get a single media file metadata and URL
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: Media object
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Media'

    delete:
      operationId: deleteMedia
      tags: [Media]
      summary: Delete a media file (removes from R2 and DB)
      description: |
        **Roles:** `OWNER`, `MANAGER`
        Cannot delete if attached to a PUBLISHED post.
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '204':
          description: Deleted
        '409':
          description: Cannot delete — attached to published post
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/ErrorResponse'

  /api/media/{id}/generate-caption:
    post:
      operationId: generateCaption
      tags: [Media]
      summary: AI-generate a caption for a photo using vision model
      description: |
        **Roles:** `OWNER`, `MANAGER`
        **Cross-domain:** → AI (`AIOrchestrationService.generate(SOCIAL_POST, imageUrl)`) using GPT-4o Vision.
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: AI-generated caption
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          caption:
                            type: string
                            example: "Fresh cocktails being poured at the bar — the evening rush is on! 🍹"

  # ═══════════════════════════════════════
  # E3: REVIEW RESPONSES
  # ═══════════════════════════════════════

  /api/reviews:
    post:
      operationId: importReview
      tags: [Review Responses]
      summary: Import a review and auto-generate AI response
      description: |
        **Roles:** `OWNER`, `MANAGER`
        AI response is generated immediately — returned with `status: GENERATED`.
        **Cross-domain:** → AI (`AIOrchestrationService.generate(REVIEW_RESPONSE, vars)`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportReviewRequest'
      responses:
        '201':
          description: Review imported with AI-generated response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewResponse'

    get:
      operationId: listReviews
      tags: [Review Responses]
      summary: List all review responses (paginated, filterable)
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '../shared/common-schemas.yaml#/components/parameters/VenueIdParam'
        - name: sourcePlatform
          in: query
          schema: { $ref: '#/components/schemas/ReviewPlatform' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReviewResponseStatus' }
        - $ref: '../shared/common-schemas.yaml#/components/parameters/PageParam'
        - $ref: '../shared/common-schemas.yaml#/components/parameters/SizeParam'
        - $ref: '../shared/common-schemas.yaml#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/PaginatedResponse'

  /api/reviews/{id}:
    get:
      operationId: getReview
      tags: [Review Responses]
      summary: Get a single review response
      parameters:
        - $ref: '#/components/parameters/ReviewIdPath'
      responses:
        '200':
          description: Review response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewResponse'

  /api/reviews/{id}/edit:
    put:
      operationId: editReviewResponse
      tags: [Review Responses]
      summary: Edit the AI-generated response before publishing
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/ReviewIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generatedResponse]
              properties:
                generatedResponse: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'

  /api/reviews/{id}/approve:
    patch:
      operationId: approveReview
      tags: [Review Responses]
      summary: "Approve for publishing (GENERATED → APPROVED)"
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/ReviewIdPath'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'

  /api/reviews/{id}/publish:
    patch:
      operationId: publishReview
      tags: [Review Responses]
      summary: "Publish to platform (APPROVED → PUBLISHED)"
      description: |
        **Roles:** `OWNER`, `MANAGER`
        **External call:** Google My Business API to post the response.
      parameters:
        - $ref: '#/components/parameters/ReviewIdPath'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'

  /api/reviews/{id}/reject:
    patch:
      operationId: rejectReview
      tags: [Review Responses]
      summary: "Reject the AI-generated response (GENERATED → REJECTED)"
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/ReviewIdPath'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'

  /api/reviews/{id}/regenerate:
    post:
      operationId: regenerateReview
      tags: [Review Responses]
      summary: Re-generate the AI response with different parameters
      description: '**Roles:** `OWNER`, `MANAGER`'
      parameters:
        - $ref: '#/components/parameters/ReviewIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tone: { type: string, example: "more formal" }
                language: { type: string, example: en }
      responses:
        '200':
          description: Regenerated response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common-schemas.yaml#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewResponse'

# ═══════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      $ref: '../shared/common-schemas.yaml#/components/securitySchemes/BearerAuth'

  parameters:
    PostIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MediaIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ReviewIdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:

    # ── Enums ──
    Platform:
      type: string
      enum: [INSTAGRAM, FACEBOOK, TIKTOK, GOOGLE_BUSINESS]
    PostStatus:
      type: string
      enum: [DRAFT, SCHEDULED, PUBLISHED, FAILED]
    MediaType:
      type: string
      enum: [IMAGE, VIDEO, CAROUSEL]
    ReviewPlatform:
      type: string
      enum: [GOOGLE_BUSINESS, TRIPADVISOR, YELP]
    ReviewResponseStatus:
      type: string
      enum: [GENERATED, APPROVED, PUBLISHED, REJECTED]

    # ── Domain Models ──
    SocialPost:
      type: object
      properties:
        id: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        content: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        status: { $ref: '#/components/schemas/PostStatus' }
        promptTemplateId: { type: integer, format: int64, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        generatedFromShiftId: { type: integer, format: int64, nullable: true }
        mediaIds:
          type: array
          items: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    SocialPostDetail:
      allOf:
        - $ref: '#/components/schemas/SocialPost'
        - type: object
          properties:
            media:
              type: array
              items:
                $ref: '#/components/schemas/Media'

    Media:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fileUrl: { type: string, format: uri }
        type: { $ref: '#/components/schemas/MediaType' }
        altText: { type: string }
        sortOrder: { type: integer }
        uploadedAt: { type: string, format: date-time }

    ReviewResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        sourcePlatform: { $ref: '#/components/schemas/ReviewPlatform' }
        originalReviewText: { type: string }
        originalRating: { type: integer, minimum: 1, maximum: 5 }
        generatedResponse: { type: string }
        status: { $ref: '#/components/schemas/ReviewResponseStatus' }
        promptTemplateId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── Request Schemas ──
    CreatePostRequest:
      type: object
      required: [venueId, content, platform]
      properties:
        venueId: { type: integer, format: int64 }
        content: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        scheduledAt: { type: string, format: date-time }
        mediaIds:
          type: array
          items: { type: integer, format: int64 }

    GeneratePostRequest:
      type: object
      required: [venueId, platform]
      properties:
        venueId: { type: integer, format: int64 }
        platform: { $ref: '#/components/schemas/Platform' }
        shiftId: { type: integer, format: int64 }
        mediaIds:
          type: array
          items: { type: integer, format: int64 }
        customPrompt: { type: string }

    UpdatePostRequest:
      type: object
      properties:
        content: { type: string }
        mediaIds:
          type: array
          items: { type: integer, format: int64 }

    ImportReviewRequest:
      type: object
      required: [venueId, sourcePlatform, originalReviewText, originalRating]
      properties:
        venueId: { type: integer, format: int64 }
        sourcePlatform: { $ref: '#/components/schemas/ReviewPlatform' }
        originalReviewText: { type: string }
        originalRating: { type: integer, minimum: 1, maximum: 5 }
