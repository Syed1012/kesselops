# Spring Boot Application Configuration
spring.application.name=kesselops

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/kesselops
spring.datasource.username=kesselops
spring.datasource.password=kesselops_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server Configuration
server.port=8080

# Spring AI - Disable autoconfiguration (using OpenRouter directly)
spring.autoconfigure.exclude=\
  org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,\
  org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration

# OpenRouter AI Configuration
kesselops.ai.openrouter.api-key=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
kesselops.ai.openrouter.models=google/gemini-2.5-flash,openai/gpt-oss-120b:free
kesselops.ai.openrouter.referer=https://kesselops.de
kesselops.ai.openrouter.app-name=KesselOps

# Logging
logging.level.de.kesselops=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
